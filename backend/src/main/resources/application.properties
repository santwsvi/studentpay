# ========================
# StudentPay - Backend
# ========================

# Datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=studentpay
quarkus.datasource.password=studentpay
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/studentpay

# Hibernate
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql
quarkus.hibernate-orm.log.sql=true

# CORS
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:5174,http://localhost:5175
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.cors.exposed-headers=Location

# Security
quarkus.http.auth.proactive=false
quarkus.security.jaxrs.deny-unannotated-endpoints=false

# JWT
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=studentpay
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.new-token.issuer=studentpay

# Mailer
quarkus.mailer.from=StudentPay <no-reply@studentpay.dev>
quarkus.mailer.mock=true