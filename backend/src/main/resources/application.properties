# ========================
# StudentPay - Backend
# ========================

# Datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=studentpay
quarkus.datasource.password=studentpay
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/studentpay

# Hibernate
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql
quarkus.hibernate-orm.log.sql=true

# CORS
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:5174,http://localhost:5175
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.cors.exposed-headers=Location

quarkus.security.jaxrs.default-roles-allowed=**
quarkus.http.auth.proactive=false

# JWT
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=studentpay
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.new-token.issuer=studentpay

# Mailer
# Remetente padrão usado por todas as notificações HTML (Qute).
quarkus.mailer.from=StudentPay <no-reply@studentpay.dev>
# Modo mock (default em dev): os e-mails NÃO são enviados; o HTML renderizado é
# logado no console e capturado pelo MockMailbox (útil para testes/CI).
quarkus.mailer.mock=true
#
# Para a demonstração/vídeo, basta subir um Mailpit local
# (docker run -p 1025:1025 -p 8025:8025 axllent/mailpit) e trocar para:
#   quarkus.mailer.mock=false
#   quarkus.mailer.host=localhost
#   quarkus.mailer.port=1025
#   quarkus.mailer.start-tls=DISABLED
# A caixa de entrada fica visível em http://localhost:8025
